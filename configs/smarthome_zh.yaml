  train: [今天用了多少电, 查一下用电量, 这个月电费多少, 本月用电量是多少, 家里耗电多少, 今天耗电量]
  test: [告诉我用了多少度电, 看看用电情况, 最近用电多不多]
- id: query.air
  group: query
  std: 查询空气质量
  train: [现在空气质量怎么样, 空气质量多少, 室内空气好不好, 查一下空气质量, 屋里空气质量如何, 空气好不好, 室内空气质量怎么样, 家里空气干净吗, 查询空气污染指数, PM2.5是多少, 屋里空气怎么样]
  test: [告诉我空气质量, 看看空气好不好, 室内空气污染严重吗]
- id: sec.arm
  group: security
  std: 开启安防布防
  train: [开启布防, 启动安防, 家里布防, 把安防打开, 开启安防模式, 布防]
  test: [打开安防布防, 启动家庭安防, 给家里布防]
- id: sec.disarm
  group: security
  std: 关闭安防布防
  train: [撤防, 关闭布防, 取消布防, 把安防关掉, 解除安防, 关闭安防模式]
  test: [解除布防, 撤销安防布防, 给家里撤防]
- id: sec.camera
  group: security
  std: 查看摄像头画面
  train: [看一下摄像头, 打开摄像头画面, 查看监控, 门口摄像头看一下, '看看{R}监控', 调出摄像头画面]
  test: [摄像头画面给我看看, 看一下监控画面, 把监控调出来]
- id: timer.set
  group: timer
  std: 设置定时关闭设备
  train: ['{T}后关空调', '{T}后把灯关掉', '{T}后关电视', '定时{T}后关机', '设置{T}后自动关闭', '{T}之后帮我关掉', '设个{T}的定时关闭']
  test: ['{T}以后关掉空调', '定个{T}的关机时间', '{T}后自动关灯']
- id: timer.cancel
  group: timer
  std: 取消定时
  train: [取消定时, 把定时取消掉, 不用定时了, 取消定时关闭, 定时关掉, 取消刚才设的定时]
  test: [取消关机定时, 定时不要了, 撤销定时任务]
- id: all.lights_off
  group: all
  std: 关闭所有灯
  train: [把所有灯都关了, 关闭全部灯光, 全屋灯关掉, 所有灯都关掉, 全部的灯关了, 把家里的灯全关了]
  test: [灯都给我关了, 全屋熄灯, 关掉每个房间的灯]
- id: all.lights_on
  group: all
  std: 打开所有灯
  train: [把所有灯都打开, 打开全部灯光, 全屋灯打开, 所有灯都开开, 全部的灯开了, 把家里的灯全打开]
  test: [灯都给我开了, 全屋亮灯, 打开每个房间的灯]
- id: all.off
  group: all
  std: 关闭所有设备
  train: [关闭所有设备, 把所有电器都关了, 全屋设备关闭, 所有设备都关掉, 全部电器关了, 把家里的电器全关了]
  test: [设备都给我关了, 全屋断电关机, 关掉所有的家电]

# ---------------------------------------------------------------- OOD（非家居意图）句子模板：只用于蒸馏与拒识阈值标定，不是意图。train 的最后 n_dev_templates 条留出作 OOD-dev
ood:
  n_dev_templates: 8
  n_per_template: {train: 50, dev: 40, test: 12}
  p_typo: 0.4
  train: [讲个笑话, 给我讲个故事, 你是谁, 你叫什么名字, 今天中午吃什么好, 推荐一部好看的电影, 帮我翻译一下这句话, 一加一等于几, 怎么做红烧肉, 附近有什么好吃的, 帮我订一张去北京的机票, '打电话给{NAME}', '给{NAME}发条消息', '导航到{PLACE}',
    今天股票涨了吗, 最近有什么新闻, 你会做什么, 帮我写一首诗, 世界上最高的山是哪座, 怎么减肥最有效, 帮我查一下快递, 今天是什么节日, 给我讲讲历史故事, 帮我算一下房贷, 我今天心情不好, 空调是什么牌子的好, 怎么清洗空调滤网, 灯泡是谁发明的, 推荐一部好看的电视剧,
    洗衣机什么牌子好用, 风扇多少钱一台, 窗帘什么颜色好看, 你多大了, 我们聊聊天吧, 帮我记个备忘, 明天有什么日程]
  test: [讲个冷笑话, 说个故事听听, 你是机器人吗, 你有名字吗, 晚上吃点什么, 有什么好看的综艺, 这个词英语怎么说, 二乘三等于几, 红烧鱼怎么做, 哪里的饭店好吃, 帮我买张高铁票, '打电话给{NAME}', '给{NAME}发个微信', '去{PLACE}怎么走',
    今天大盘怎么样, 有什么热点新闻, 你都会些什么, 写首关于春天的诗, 中国最长的河是哪条, 怎么才能睡得好, 查一下我的快递到哪了, 明天是不是节假日, 空调和风扇哪个更省电, 洗衣机怎么保养, 什么灯对眼睛好, 电视剧推荐一下, 我有点无聊, 陪我聊会儿天]

# ---------------------------------------------------------------- 切分与采样
split: {n_dev_templates: 2}
sampling: {p_room: 0.45, p_room_de: 0.5, p_typo: 0.42, p_std_typo: 0.06}
counts: {train: 420, dev: 40, test: 80}

# ---------------------------------------------------------------- ASR 错字噪声。custom_confusions 用来放真实 ASR 的错误统计：{正确字: {常被识别成的错字: 权重}}，
# 例如 {开: {凯: 3, 揩: 1}, 灯: {等: 5, 登: 2}}；字命中时以 p_custom 的概率优先用它，否则回落到同音/近音规则
asr:
  op_names: [sub, drop, dup, filler, swap]
  op_weights: [0.62, 0.12, 0.06, 0.14, 0.06]
  n_ops_values: [1, 2, 3]
  n_ops_weights: [0.5, 0.35, 0.15]
  max_ops: 3
  fillers: [呃, 嗯, 啊, 那个, 这个, 就是, 然后, 哎, 额]
  filler_single: [呃, 嗯, 啊, 额]
  p_filler_edge: 0.5
  p_exact: 0.6
  init_fuzzy: {zh: z, ch: c, sh: s, n: l, r: l, h: f}
  final_fuzzy: {ang: an, eng: en, ing: in, iang: ian, uang: uan, ong: un}
  gb2312_levels: [1]
  custom_confusions: {}
  p_custom: 0.5
